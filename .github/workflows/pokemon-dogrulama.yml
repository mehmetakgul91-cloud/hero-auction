name: Pokemon kart dogrulama
on:
  push:
    branches:
      - feature/tam-kart-arsivi
      - release/pokemon-1025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kod sozdizimi
        run: |
          node --check server.js
          node --check public/app.js
      - name: Pokemon kartlarini denetle
        run: node tools/verify-pokemon.mjs
