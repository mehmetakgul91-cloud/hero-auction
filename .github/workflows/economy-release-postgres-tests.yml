name: Economy operator PostgreSQL integration
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'tools/economy-*.mjs'
      - 'tools/apply-economy-migrations.mjs'
      - 'tools/test-postgres-economy-release.mjs'
      - 'tests/economy-release-*.test.mjs'
      - 'package*.json'
      - '.github/workflows/economy-release-postgres-tests.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'tools/economy-*.mjs'
      - 'tools/apply-economy-migrations.mjs'
      - 'tools/test-postgres-economy-release.mjs'
      - 'tests/economy-release-*.test.mjs'
      - 'package*.json'
      - '.github/workflows/economy-release-postgres-tests.yml'
permissions:
  contents: read
jobs:
  postgres-release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        commit-response: [normal, lost-commit]
    services:
      postgres:
        # Same official pinned PG18 image as the isolated game-economy jobs.
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # Name must match strict operator SQL identity; ONLY loopback fixture
          # credentials/host are allowed. No production secret is read or used.
          POSTGRES_DB: hero_auction_db
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U test -d hero_auction_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Operator safety guards and deterministic unit tests
        run: node --test tests/economy-release-*.test.mjs
      - name: Real operator catalog, atomic DDL, preservation, rollback and replay
        env:
          HERO_ECONOMY_RELEASE_TEST_DB: postgresql://test:test@127.0.0.1:5432/hero_auction_db
          HERO_ECONOMY_RELEASE_TEST_CONFIRM: CREATE_DISPOSABLE_OPERATOR_FIXTURE
          HERO_ECONOMY_RELEASE_TEST_COMMIT_RESPONSE: ${{ matrix.commit-response }}
        run: node tools/test-postgres-economy-release.mjs
