name: Auction Bid Refresh Regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/app.js'
      - 'public/auction-view-state.js'
      - 'tests/auction-bid-refresh.test.mjs'
      - 'tests/auction-view-state.test.mjs'
      - 'tools/test-auction-bid-browser.mjs'
      - '.github/workflows/auction-bid-browser.yml'
permissions:
  contents: read
jobs:
  combined-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run audit:strict
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and official headless Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Test real auction controls with isolated synthetic accounts
        run: node tools/test-auction-bid-browser.mjs
