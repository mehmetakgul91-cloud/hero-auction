name: Audit character image coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit-remote-images.mjs'
      - '.github/workflows/audit-character-images.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/audit-remote-images.mjs
      - name: Commit image audit report to repository
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/remote-image-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified character image coverage report [skip ci]'
            for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Unable to push report after three attempts' >&2
          exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-image-audit
          path: tools/remote-image-audit.json
