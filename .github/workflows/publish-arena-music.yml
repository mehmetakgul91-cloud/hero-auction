name: Publish Arena Music MP3
on:
  push:
    branches-ignore: [fix/android-portrait-review-20261024]
    paths:
      - 'tools/build-arena-music.py'
      - '.github/workflows/publish-arena-music.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: |
          python -m pip install numpy scipy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate approved two-minute MP3
        run: python tools/build-arena-music.py
      - name: Commit MP3 to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/hero-auction-senkron-davul-bas-2dk.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved synchronized arena MP3"
            git push
          fi
