name: Commander battle tests
on:
  push:
    branches: [main]
    paths:
      - 'battle-engine.js'
      - 'arena-commanders.js'
      - 'tools/test-commander-battle.mjs'
      - 'test/commander-manual.test.js'
      - '.github/workflows/commander-tests.yml'
  workflow_dispatch:
jobs:
  commander-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing commander regression suite
        run: node tools/test-commander-battle.mjs
      - name: Manual commander ability tests
        run: node --test test/commander-manual.test.js
