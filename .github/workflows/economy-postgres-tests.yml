name: Economy PostgreSQL integration
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'paid-diamonds.js'
      - 'paid-diamond-exchange.js'
      - 'diamond-signup-bonus.js'
      - 'login-rewards.js'
      - 'server.js'
      - 'arena-commanders.js'
      - 'public/commander-economy.js'
      - 'package*.json'
      - 'tools/test-postgres-economy.mjs'
      - '.github/workflows/economy-postgres-tests.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'paid-diamonds.js'
      - 'paid-diamond-exchange.js'
      - 'diamond-signup-bonus.js'
      - 'login-rewards.js'
      - 'server.js'
      - 'arena-commanders.js'
      - 'public/commander-economy.js'
      - 'package*.json'
      - 'tools/test-postgres-economy.mjs'
      - '.github/workflows/economy-postgres-tests.yml'
permissions:
  contents: read
jobs:
  postgres-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Official Docker Library PostgreSQL18 image, pinned to the digest actually
        # exercised by the first isolated CI run. No production database access.
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hero_economy_test
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U test -d hero_economy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real PostgreSQL constraints, transactions and concurrency
        env:
          # Disposable fixture credential, never a repository/production secret.
          HERO_ECONOMY_TEST_DB: postgresql://test:test@127.0.0.1:5432/hero_economy_test
        run: node tools/test-postgres-economy.mjs
