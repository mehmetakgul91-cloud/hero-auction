name: Android portrait diagnostics (no release)
on:
  workflow_dispatch:
  push:
    branches: [fix/android-portrait-review-20261024]
permissions:
  contents: read
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: 640x1136
            font: '1.0'
          - size: 780x1688
            font: '1.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare isolated native test build
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund
          node --test *.test.js tests/*.test.* test/*.test.js
          npm run audit:strict
          npm --prefix mobile test
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const origin='https://hero-auction-commander-test.onrender.com';
          writeFileSync('mobile/config.local.json',JSON.stringify({apiOrigin:origin,publicOrigin:origin}));
          JS
          npm --prefix mobile run sync
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Portrait WebView and alias safety tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: adb shell wm size ${{ matrix.size }} && adb shell wm density 320 && adb shell settings put system font_scale ${{ matrix.font }} && bash mobile/scripts/device-test.sh
      - name: Verify diagnostic APK without publishing
        run: |
          python3 mobile/scripts/verify-apk.py mobile/android/app/build/outputs/apk/debug/app-debug.apk > artifacts/apk-verification.json
          cp mobile/package-report.json artifacts/package-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-diagnostics-${{ matrix.size }}-font-${{ matrix.font }}
          path: |
            artifacts/
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
          retention-days: 7
