name: Android development verification (no release)
on:
  pull_request:
    paths: ['mobile/**', 'native-cors.js', 'server.js', 'public/**', '.github/workflows/android-portrait-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-development-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: 640x1136
            font: '1.0'
          - size: 780x1688
            font: '1.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund
      - name: Native packaging, runtime and shared-room regressions
        run: |
          node --test tests/native-cors.test.mjs
          npm --prefix mobile test
          npm run audit:strict
      - name: Start disposable current-source backend
        run: |
          mkdir -p artifacts
          node mobile/scripts/test-backend.mjs > artifacts/test-backend.log 2>&1 &
          echo $! > mobile/.test-backend.pid
          for attempt in $(seq 1 100); do
            if curl --silent --fail --cacert mobile/.test-backend/cert.pem https://localhost:3443/api/info > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail --cacert mobile/.test-backend/cert.pem https://localhost:3443/api/info > artifacts/backend-info.json
          npm --prefix mobile run sync
      - name: Compile before booting the emulator
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify exact diagnostic APK
        run: |
          python3 mobile/scripts/verify-apk.py mobile/android/app/build/outputs/apk/debug/app-debug.apk > artifacts/apk-verification.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify mobile/android/app/build/outputs/apk/debug/app-debug.apk
          cp mobile/package-report.json artifacts/package-report.json
          cp mobile/www/native-build.json artifacts/native-build.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Current game on Android 15 WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Pin 36.1.9 while the 37.2.12 runner exits during real touch input.
          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          ram-size: 2048M
          pre-emulator-launch-script: python3 mobile/scripts/configure-emulator.py ${{ matrix.size }}
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: adb reverse tcp:3443 tcp:3443 && adb shell settings put system font_scale ${{ matrix.font }} && bash mobile/scripts/device-test.sh
      - name: Stop disposable backend
        if: always()
        run: |
          if test -f mobile/.test-backend.pid; then kill "$(cat mobile/.test-backend.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diagnostics-${{ matrix.size }}-font-${{ matrix.font }}
          path: |
            artifacts/
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
          retention-days: 14
  phone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build installable APK for the existing guest test server
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund
          mkdir -p artifacts
          node mobile/scripts/configure-phone.mjs
          npm --prefix mobile run sync
          cd mobile/android
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify phone package and system certificate policy
        run: |
          python3 mobile/scripts/verify-apk.py mobile/android/app/build/outputs/apk/debug/app-debug.apk > artifacts/apk-verification.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs mobile/android/app/build/outputs/apk/debug/app-debug.apk > artifacts/apk-signature.txt
          test ! -d mobile/android/app/src/debug
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/Hero-Auction-Test-0.2.1.apk
          cp mobile/package-report.json artifacts/package-report.json
          cp mobile/www/native-build.json artifacts/native-build.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exact phone APK through a complete match on the public test server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Pin 36.1.9 while the 37.2.12 runner exits during real touch input.
          emulator-build: 13823996
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          ram-size: 2048M
          pre-emulator-launch-script: python3 mobile/scripts/configure-emulator.py 780x1688
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: adb shell settings put system font_scale 1.3 && bash mobile/scripts/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-auction-phone-test
          path: artifacts/
          retention-days: 30
