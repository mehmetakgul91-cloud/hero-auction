name: Free Commander Choice Browser QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/commander-economy.js'
      - 'public/match-commander-picker.*'
      - 'public/combined-preparation.*'
      - 'public/preparation-formation.js'
      - 'tests/combined-preparation*.test.mjs'
      - 'tools/test-portrait-preparation-browser.mjs'
      - 'public/battle-preview.*'
      - 'tests/match-commander-picker.test.mjs'
      - 'tools/test-match-commander-picker-browser.mjs'
      - 'public/index.html'
      - 'public/lobby-chrome.css'
      - 'public/images/optimized/home-play-arena.*.webp'
      - 'tests/home-play-artwork.test.mjs'
      - 'tools/test-home-play-artwork-browser.mjs'
      - 'public/app.js'
      - 'public/crazygames-en.js'
      - 'public/crazygames-ui-phrases.js'
      - 'public/first-session.js'
      - 'tests/commander-switch-*.test.mjs'
      - 'tools/test-commander-switch-browser.mjs'
      - '.github/workflows/commander-switch-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and official headless Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Test free choice, progression preservation and bilingual copy
        run: node --test tests/commander-switch-api.test.mjs tests/commander-switch-ui.test.mjs tests/commander-progression.test.js tests/first-session.test.mjs tests/public-landing-social.test.mjs tests/match-commander-picker.test.mjs tests/combined-preparation.test.mjs tests/combined-preparation-http.test.mjs tests/combined-preparation-lifecycle.test.mjs tests/preparation-ready.test.mjs tests/home-play-artwork.test.mjs
      - name: Verify free choice at zero gold for new and existing accounts in TR and EN
        env:
          HERO_BROWSER_SCREENSHOTS: ${{ runner.temp }}/commander-switch-shots
        run: env -u DATABASE_URL node tools/test-commander-switch-browser.mjs
      - name: Verify combined preparation and legacy picker at mobile and desktop sizes
        env:
          HERO_BROWSER_SCREENSHOTS: ${{ runner.temp }}/commander-switch-shots/match-picker
        run: env -u DATABASE_URL node tools/test-match-commander-picker-browser.mjs
      - name: Verify portrait cards, same-lane swaps and permanent center defense at all lane counts
        env:
          HERO_BROWSER_SCREENSHOTS: ${{ runner.temp }}/commander-switch-shots/portrait-preparation
        run: env -u DATABASE_URL node tools/test-portrait-preparation-browser.mjs
      - name: Verify distinct Play artwork at responsive sizes in TR and EN
        env:
          HERO_BROWSER_SCREENSHOTS: ${{ runner.temp }}/commander-switch-shots/play-artwork
        run: env -u DATABASE_URL node tools/test-home-play-artwork-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commander-switch-browser-frames
          path: ${{ runner.temp }}/commander-switch-shots
          if-no-files-found: warn
