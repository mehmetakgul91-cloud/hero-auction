name: Room Return Browser Regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/app.js'
      - 'public/room-resume.js'
      - 'public/auction-tail-reveal.js'
      - 'public/auction-delivery-state.js'
      - 'public/auction-delivery-portraits.js'
      - 'auction-reveal-events.js'
      - 'tools/test-room-return-browser.mjs'
      - '.github/workflows/room-return-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and official headless Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Test room return with isolated synthetic accounts
        run: node tools/test-room-return-browser.mjs
