name: Commander regression tests
on:
  push:
    branches:
      - test/commander-arena-2-20261020
  workflow_dispatch:
jobs:
  commander-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commander regression tests
        run: node --test tests/commander-regression.test.mjs tests/commander-turns.test.mjs tests/commander-transcript.test.mjs tests/commander-match-session.test.mjs tests/commander-room-bridge.test.mjs tests/commander-room-integration.test.mjs tests/commander-http.test.mjs tests/commander-battle-e2e.test.mjs tests/commander-arena-cues.test.mjs tests/commander-arena-effects.test.mjs tests/commander-arena-three.test.mjs tests/commander-round-playback.test.mjs tests/commander-live-abilities.test.mjs tests/commander-live-cooldown.test.mjs tests/commander-live-effects.test.mjs tests/commander-live-combat.test.mjs tests/commander-snapshot-sync.test.mjs tests/commander-live-hero-actions.test.mjs tests/commander-battle-log-bridge.test.mjs
      - name: Existing battle balance smoke test
        run: node tools/battle-balance.mjs > /tmp/hero-auction-balance.json
