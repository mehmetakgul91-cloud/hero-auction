name: Commander regression tests
on:
  push:
    branches:
      - test/commander-arena-2-20261020
  workflow_dispatch:
jobs:
  commander-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commander regression tests
        run: node --test tests/commander-regression.test.mjs tests/commander-turns.test.mjs tests/commander-transcript.test.mjs tests/commander-match-session.test.mjs tests/commander-room-bridge.test.mjs tests/commander-room-integration.test.mjs tests/commander-http.test.mjs tests/commander-battle-e2e.test.mjs tests/commander-arena-cues.test.mjs tests/commander-arena-effects.test.mjs tests/commander-arena-three.test.mjs tests/commander-round-playback.test.mjs tests/commander-live-abilities.test.mjs tests/commander-live-cooldown.test.mjs tests/commander-live-effects.test.mjs tests/commander-live-combat.test.mjs tests/commander-snapshot-sync.test.mjs tests/commander-live-hero-actions.test.mjs tests/commander-battle-log-bridge.test.mjs tests/commander-incremental-basic.test.mjs tests/commander-persistent-shield.test.mjs tests/commander-effect-duration.test.mjs tests/commander-magic-target-picker.test.mjs tests/commander-magic-cast-controls.test.mjs tests/battle-action-scheduler.test.mjs tests/commander-basic-turn-session.test.mjs tests/battle-target-selection.test.mjs tests/battle-damage-formula.test.mjs tests/commander-parity-basic-attack.test.mjs tests/battle-special-formulas.test.mjs tests/commander-live-splash.test.mjs tests/commander-live-special-heal.test.mjs tests/commander-parity-shield-drain.test.mjs tests/commander-parity-thorns.test.mjs tests/commander-live-arena-session.test.mjs tests/commander-live-arena-controls.test.mjs tests/commander-live-arena-bridge.test.mjs tests/commander-live-arena-registry.test.mjs tests/commander-live-room-binding.test.mjs tests/commander-live-arena-pacer.test.mjs tests/commander-live-arena-runner.test.mjs tests/commander-live-arena-lifecycle.test.mjs tests/commander-live-team-preparation.test.mjs tests/commander-parity-passives.test.mjs tests/commander-round-passive-integration.test.mjs tests/commander-roster-parity-audit.test.mjs tests/commander-combined-passive-special.test.mjs tests/commander-parity-damage-special.test.mjs tests/commander-full-roster-preparation.test.mjs tests/commander-damage-special-normal-rounds.test.mjs tests/commander-original-full-combat.test.mjs tests/commander-two-player-five-v-five.test.mjs
      - name: Full hero skill parity audit
        run: node scripts/report-commander-parity.mjs
      - name: Existing battle balance smoke test
        run: node tools/battle-balance.mjs > /tmp/hero-auction-balance.json
