name: Pokemon kartlarini toplu hazirla
on:
  workflow_dispatch:
    inputs:
      first:
        description: 'Ilk Pokedex numarasi'
        required: true
        default: '1'
      last:
        description: 'Son Pokedex numarasi'
        required: true
        default: '1025'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pokemon kartlarini indir
        run: node tools/sync-pokemon.mjs "${{ inputs.first }}" "${{ inputs.last }}"
      - name: Dosyalari commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards.json public/images/pokemon
          git diff --cached --quiet || (git commit -m "Pokemon yerel kart arsivi" && git push)
