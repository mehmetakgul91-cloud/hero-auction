name: Arena and Auction Emote Browser Regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/arena-emotes*'
      - 'public/auction-emotes.js'
      - 'public/images/arena-emotes/**'
      - 'public/app.js'
      - 'public/battle-preview*'
      - 'public/commander-experimental.js'
      - 'tools/test-arena-emotes-browser.mjs'
      - '.github/workflows/arena-emotes-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Test production emote modules with synthetic accounts
        run: node tools/test-arena-emotes-browser.mjs
