<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hero class effects · local QA</title><style>
*{box-sizing:border-box}body{margin:0;background:#10131a;color:#edf4ff;font:14px system-ui}header{padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:17px}label{display:inline-flex;align-items:center;gap:6px}select,button{padding:7px 10px;background:#242c3b;color:#fff;border:1px solid #4a5871;border-radius:6px}button{cursor:pointer}#status{padding:9px 20px;background:#1e2635;white-space:pre-wrap;min-height:38px}#viewport{margin:12px auto;max-width:100%;overflow:hidden;border:1px solid #485063;border-radius:8px}iframe{width:100%;height:860px;border:0;display:block}.note{color:#a4b3c8;padding:0 20px 10px;font-size:12px}
</style></head><body><header><h1>Non-archer class effects · local QA</h1><label>Class<select id="hero"><option value="mage">Mage</option><option value="fighter">Fighter</option><option value="tank">Tank</option><option value="healer">Healer</option><option value="archer">Archer baseline</option></select></label><label>Action<select id="action"><option value="normal">Normal attack</option><option value="special">Special attack</option><option value="heal">Heal ally</option><option value="shield">Shield ally</option></select></label><label>Side<select id="side"><option value="0">Left to right</option><option value="1">Right to left</option></select></label><label>Width<select id="width"><option value="1200">Desktop</option><option value="390">390px</option><option value="320">320px</option></select></label></header><header><button id="prepare">Prepare</button><button id="travel">Travel</button><button id="contact">Contact</button><button id="recover">Recovery</button><button id="play">Play</button><button id="clear">Clear</button><button id="checks">Run regression checks</button></header><div id="status">Loading real arena modules…</div><div id="viewport" style="width:1200px"><iframe title="Synthetic arena" src="/battle-preview.html?room=arena"></iframe></div><div class="note">Isolated synthetic battle. Uses the real arena DOM, CSS and animation modules. No accounts, payments, database or production requests.</div><script type="module">
const $=id=>document.getElementById(id),frame=document.querySelector('iframe'),ids={mage:'original:09',fighter:'original:07',tank:'original:01',healer:'original:15',archer:'original:13'};let serial=0,playFrame,elapsed=0;
const doc=()=>frame.contentDocument,win=()=>frame.contentWindow;
function clear(){cancelAnimationFrame(playFrame);win().dispatchEvent(new Event('heroarena:route-change'));for(const a of doc().getAnimations())a.cancel();}
function begin(){clear();const action=$('action').value,side=Number($('side').value);win().dispatchEvent(new (win().CustomEvent)('heroarena:experimental-move',{detail:{event:{side,version:++serial,actor:ids[$('hero').value],target:'original:01',action:['heal','shield'].includes(action)?action:'attack',damageType:action==='special'?'special':action==='normal'?'normal':undefined,value:164}}}));elapsed=0;}
function freeze(ms){win().__visualClock.advance(ms-elapsed);elapsed=ms;for(const a of doc().getAnimations()){a.pause();a.currentTime=a.effect?.target?.classList?.contains('arena-floating-damage')?Math.max(0,ms-(['heal','shield'].includes($('action').value)?0:$('action').value==='special'?840:600)):ms;}$('status').textContent=`${$('hero').value} · ${$('action').value} · ${ms} ms · effects ${doc().querySelectorAll('.hero-fx').length} · labels ${[...doc().querySelectorAll('.arena-floating-damage')].map(x=>x.textContent).join(', ')||'none'}`;}
function sample(phase){begin();const special=$('action').value==='special',arrival=special?840:600;freeze(({prepare:special?220:150,travel:special?620:430,contact:arrival+20,recover:arrival+210})[phase]);}
for(const phase of ['prepare','travel','contact','recover'])$(phase).onclick=()=>sample(phase);
$('clear').onclick=()=>{clear();$('status').textContent='Cleared: '+doc().querySelectorAll('.hero-fx,.arena-floating-damage').length+' remaining effects/labels'};
$('play').onclick=()=>{begin();const start=performance.now();const tick=()=>{const ms=Math.min(2200,performance.now()-start);freeze(ms);if(ms<2200)playFrame=requestAnimationFrame(tick)};tick()};
$('width').onchange=()=>{clear();$('viewport').style.width=$('width').value+'px';win().dispatchEvent(new Event('resize'));$('status').textContent='Viewport '+$('width').value+'px';};
$('checks').onclick=()=>{try{let checks=0;const assert=(v,m)=>{if(!v)throw Error(m);checks++};const before=JSON.stringify(win().heroArenaTeams);for(const hero of Object.keys(ids))for(const special of [false,true])for(const side of ['0','1']){$('hero').value=hero;$('action').value=special?'special':'normal';$('side').value=side;begin();const arrival=special?840:600;if(hero!=='archer'){freeze(special?359:239);assert(Number(getComputedStyle(doc().querySelector('.hero-fx-flight')).opacity)===0,hero+' projectile visible during preparation');freeze(special?600:420);assert(Number(getComputedStyle(doc().querySelector('.hero-fx-flight')).opacity)>0,hero+' missing travelling projectile')}freeze(arrival-1);assert(doc().querySelectorAll('.arena-floating-damage').length===0,hero+' premature damage');freeze(arrival);assert(doc().querySelectorAll('.arena-floating-damage').length===1,hero+' contact label');const actor=doc().querySelector('#team-'+(side==='0'?'a':'b')+' [data-hero-id="'+ids[hero]+'"]');if(['fighter','tank'].includes(hero)){const pose=new DOMMatrix(getComputedStyle(actor).transform);assert(Math.hypot(pose.m41,pose.m42)>1,hero+' lost forward pose')}if(hero==='archer')assert(!doc().querySelector('.class-fighter,.class-tank,.class-mage,.class-healer'),'archer received new class');freeze(4000);assert(doc().querySelectorAll('.hero-fx,.arena-floating-damage').length===0,hero+' resources remained')}$('hero').value='healer';$('action').value='heal';begin();freeze(0);assert(doc().querySelectorAll('.hero-fx-restore').length===1,'missing immediate heal cue');assert(doc().querySelectorAll('.arena-floating-damage').length===1,'missing immediate heal label');clear();assert(doc().querySelectorAll('.hero-fx,.arena-floating-damage').length===0,'interruption cleanup');assert(JSON.stringify(win().heroArenaTeams)===before,'battle state mutated');$('status').textContent='PASS '+checks+' browser assertions: real arena classes, exact 600/840ms contact, left/right, held melee contact, unchanged archer, immediate healing cue, cleanup, unchanged battle state.'}catch(e){$('status').textContent='FAIL '+e.stack}};
frame.addEventListener('load',()=>{const timer=setInterval(()=>{if(doc().querySelectorAll('.hero').length===10){clearInterval(timer);if($('status').textContent.startsWith('Loading'))$('status').textContent='Ready: real arena loaded with five synthetic heroes per team.'}},100)});
</script></body></html>
