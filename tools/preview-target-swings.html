<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Güçlü yakın dövüş · hareketli önizleme</title><link rel="stylesheet" href="/hero-attack-effects.css"><style>
*{box-sizing:border-box}body{margin:0;background:#0b101a;color:#eef2ff;font:16px system-ui}#preview{width:960px;height:760px;padding:32px 48px;background:radial-gradient(ellipse at 48% 30%,#303247,#111722 70%);position:relative;overflow:hidden}header{height:110px;display:flex;justify-content:space-between;align-items:flex-start}h1{font-size:34px;letter-spacing:-1px;margin:0 0 10px}header p{margin:0;color:#bbc8dc;font-size:17px}.badge{border:1px solid #686d82;border-radius:20px;padding:9px 13px;font-size:12px;color:#bac8e3}.label{height:74px;display:flex;align-items:center;gap:20px;border-top:1px solid #ffffff17}.label h2{font-size:30px;margin:0;color:#ffe1a8}.label p{margin:0;color:#bac7da;font-size:17px}.arena{height:414px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:70px 42px 0}.hero{width:166px;position:relative;z-index:3}.arena-portrait{width:166px;height:207px;border:2px solid #6b9eee;border-radius:15px;overflow:hidden;background:#182039;box-shadow:0 10px 28px #0008}.target .arena-portrait{border-color:#e883af}.arena-portrait img{width:100%;height:100%;object-fit:cover}.name{font-size:14px;color:#c0cee2;text-align:center;margin-top:11px}.health{height:6px;background:#67cda4;border-radius:6px;margin:10px 10px 0}.target .health{background:#ed82aa}.damage{position:absolute;left:55px;top:-34px;color:#fff5de;font-size:32px;font-weight:900;text-shadow:0 2px 3px #000,0 0 9px #e7b37d;opacity:0;z-index:110}.centerline{position:absolute;left:48%;top:235px;color:#697a96;font-size:30px}footer{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:#aab9d3;padding-top:23px;border-top:1px solid #ffffff17}#phase{color:#ffdfa9;font-weight:600}.controls{position:fixed;left:980px;top:20px;width:190px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;padding:8px;background:#26324a;color:white;border:1px solid #52627c;border-radius:6px}input{width:90px}.hero-fx-cast{opacity:.7}.progress{height:3px;background:#313b50;position:relative;margin-top:18px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#a47c48,#f6d29a);width:0}#preview.mobile{width:390px;padding:22px;height:760px}#preview.mobile header{height:130px}#preview.mobile h1{font-size:23px}#preview.mobile header p{font-size:14px}#preview.mobile .badge{display:none}#preview.mobile .label{display:block;height:115px;padding-top:20px}#preview.mobile .label h2{font-size:25px}#preview.mobile .label p{font-size:14px;margin-top:8px}#preview.mobile .arena{height:290px;padding:30px 16px 0}#preview.mobile .hero,#preview.mobile .arena-portrait{width:54px}#preview.mobile .arena-portrait{height:66px;border-radius:7px}#preview.mobile .name{font-size:9px;min-height:30px}#preview.mobile .health{height:3px;margin:5px 3px 0}#preview.mobile .damage{font-size:20px;top:-26px;left:5px}#preview.mobile .centerline{top:140px}#preview.mobile footer{display:block;font-size:12px;line-height:1.8}
</style></head><body><main id="preview"><header><div><h1>Yakın dövüş · güçlü darbe</h1><p>Büyük silah, keskin savuruş, hedef üzerinde belirgin temas.</p></div><span class="badge">CANLIYA ALINMADI</span></header><div class="label"><h2 id="weapon-title"></h2><p id="weapon-note"></p></div><section id="lanes"></section><footer><span id="phase">Hazırlanma</span><span>Silah efekti önizlemesi · gerçek kahraman görselleri</span></footer><div class="progress"><span id="progress"></span></div></main><div class="controls"><label>Silah <select id="weapon"><option value="sword">Kılıç</option><option value="axe">Balta</option><option value="dagger">Bıçak</option></select></label><button id="play">Oynat</button><button id="reset">Başa dön</button><button id="next">Sonraki kare</button><label>Kare <input id="frame" type="number" value="0" min="0" max="89"></label><button id="mobile">Mobil ölçü</button><button id="checks">Kontrolleri çalıştır</button><span id="status">Hazır</span></div><script>window.addEventListener('error',e=>document.getElementById('status').textContent='ERROR '+(e.message||e.target?.src||'resource'),true);window.addEventListener('unhandledrejection',e=>document.getElementById('status').textContent='ERROR '+e.reason);</script><script type="module">
import {playHeroAttack} from '/hero-attack-effects.js';import {createCombatEffects} from '/arena-combat-effects.js';
const examples={sword:{id:'original:07',role:'fighter',title:'Kılıç',name:'Alev Zırhı',image:'/images/optimized/hero-07.b3e0656bfdaee5d6.webp',note:'Uzun, geniş çelik namlu · güçlü çapraz kesiş'},axe:{id:'original:expansion-03',role:'fighter',title:'Balta',name:'Kuzey Baltası',image:'/images/original/expansion-03.webp',note:'Geniş ağız · ağır hazırlık · sert aşağı darbe'},dagger:{id:'original:05',role:'assassin',title:'Bıçak',name:'Gölge Suikastçı',image:'/images/optimized/hero-05.4c20a67737b9604b.webp',note:'Daha kısa silüet · hızlı ve keskin yakın darbe'}};
let selected='sword',now=0,seq=0,timers=new Map(),owners=[],births=new Map(),raf,frame=0,hits=0;const realRAF=window.requestAnimationFrame.bind(window),realCancel=window.cancelAnimationFrame.bind(window);document.defaultView.requestAnimationFrame=fn=>{timers.set(++seq,{fn:()=>fn(now),at:now+16});return seq};document.defaultView.cancelAnimationFrame=id=>timers.delete(id);
function build(){const h=examples[selected];document.getElementById('weapon-title').textContent=h.title;document.getElementById('weapon-note').textContent=h.note;document.getElementById('lanes').innerHTML=`<div class="lane"><div class="arena"><div class="hero actor"><div class="arena-portrait"><img src="${h.image}" alt="${h.name}"></div><div class="health"></div><div class="name">${h.name}</div></div><span class="centerline">›</span><div class="hero target"><div class="arena-portrait"><img src="/images/optimized/hero-01.b665ec740080815b.webp" alt="Hedef kahraman"></div><div class="health"></div><div class="name">Hedef kahraman</div><span class="damage">−164</span></div></div></div>`}
function clear(){realCancel(raf);for(const e of owners)e.clear();owners=[];timers.clear();for(const a of document.getAnimations())a.cancel();births.clear();hits=0;now=0;}
function remember(){for(const a of document.getAnimations()){if(!births.has(a))births.set(a,now);a.pause()}}
function begin(){clear();const lane=document.querySelector('.lane'),effects=createCombatEffects({document,maxResources:6,setTimer(fn,ms){timers.set(++seq,{fn,at:now+ms});return seq},clearTimer(id){timers.delete(id)}});owners.push(effects);const actor=lane.querySelector('.actor'),target=lane.querySelector('.target');playHeroAttack({document,effects,actor,target,hero:examples[selected],kind:'strike',time:850,clock:()=>now,onImpact(){hits++}});actor.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)',offset:.2},{transform:'translateX(38px)',offset:.72},{transform:'translateX(38px)',offset:.83},{transform:'translateX(0)'}],{duration:790,fill:'both',easing:'ease-out'});remember();}
function sample(ms){begin();let n=0;while(++n<10000){const next=[...timers].filter(([,t])=>t.at<=ms).sort((a,b)=>a[1].at-b[1].at)[0];if(!next)break;const[id,t]=next;now=t.at;timers.delete(id);t.fn();remember()}now=ms;for(const a of document.getAnimations()){a.pause();a.currentTime=ms-(births.get(a)||0)}const l=document.querySelector('.damage');l.style.opacity=ms>=600&&ms<1150?String(Math.min(1,(1150-ms)/180)):'0';l.style.transform=`translateY(${-Math.max(0,ms-600)*.035}px)`;document.getElementById('phase').textContent=ms<240?'Hazırlanma':ms<500?'Silahı kaldırma':ms<600?'Hızlı savuruş':ms<740?'Darbe · hedefte geri tepme':ms<1000?'Toparlanma':'Tekrar';document.getElementById('progress').style.width=Math.min(100,ms/14)+'%';document.getElementById('status').textContent=`${ms} ms · ${hits} temas`}
function show(){document.getElementById('frame').value=frame;sample(frame*1000/30)}document.getElementById('weapon').onchange=e=>{selected=e.target.value;build();frame=0;show()};document.getElementById('frame').oninput=e=>{frame=Number(e.target.value);show()};document.getElementById('next').onclick=()=>{frame=(frame+1)%60;show()};document.getElementById('reset').onclick=()=>{frame=0;show()};document.getElementById('play').onclick=()=>{let start=performance.now();const tick=()=>{frame=Math.floor((performance.now()-start)/1000*30)%60;show();raf=realRAF(tick)};tick()};document.getElementById('mobile').onclick=()=>{document.getElementById('preview').classList.toggle('mobile');show()};document.getElementById('checks').onclick=()=>{let checks=0;for(const kind of Object.keys(examples)){selected=kind;build();for(const ms of [0,239,240,430,599,600,620,850,1500,2200]){sample(ms);if(ms<820&&document.querySelectorAll('.hero-fx-swing').length!==1)throw Error('Missing swing');if(document.querySelector('.hero-fx-flight'))throw Error('Thrown weapon remains');if(hits!==(ms>=600?1:0))throw Error('Changed contact timing');checks+=3}}selected='sword';document.getElementById('weapon').value=selected;build();frame=18;show();document.getElementById('status').textContent=`PASS ${checks} checks · no projectiles · exact600ms contact`};build();show();
</script></body></html>
